name: build

on:
  # main 的提交由 release.yml 调用本工作流。
  push:
    branches: [mod]
  pull_request:
    branches: [mod, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        # 已知偶发：整套测试在 CI 上偶尔被整体中止，受害者随机（表现为某个 test
        # 文件整批 did not complete、单跑该文件却全过，日志里没有任何超时或异常）。
        # 已实测：同一 runner、同一提交，单独跑 3 次全过，全量串行也 +984 全过，
        # 所以这是环境抖动而非用例缺陷，用重试吸收；连试 3 次仍失败即真实失败。
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次尝试"
            if flutter test --reporter compact --concurrency=1; then
              echo "测试通过（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::第 $attempt 次测试失败，重试"
          done
          echo "::error::连续 3 次测试失败，判定为真实失败"
          exit 1

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v

  windows:
    name: windows release
    needs: verify
    # 固定在 VS 2022 镜像：windows-latest 已是 VS 2026（MSVC 14.51），
    # flutter_inappwebview_windows 依赖 <experimental/coroutine>，在 VS 2026 下是硬错误。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证 Windows 差异更新、整包更新和回滚
        run: python -B tool/test_windows_delta.py -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备内置 JVM / 加固壳 / Python / Yaozhi MPV
        shell: pwsh
        run: |
          ./tool/prepare_windows_runtimes.ps1 -PythonIndex https://pypi.org/simple/
          ./tool/prepare_windows_runtimes.ps1 -Standard

      - name: 验证内置运行时离线可用
        run: flutter test --no-pub test/bundled_runtime_offline_test.dart

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: 预装 WebView2 构建依赖
        shell: pwsh
        run: |
          # WebView 插件的 MSBuild 工程在加载时导入这些包的 .targets。
          # 版本与锁定的 flutter_inappwebview_windows 0.6.0 对齐。
          $packages = @{
            'Microsoft.Windows.ImplementationLibrary' = '1.0.231216.1'
            'Microsoft.Web.WebView2' = '1.0.2792.45'
            'nlohmann.json' = '3.11.2'
          }
          foreach ($package in $packages.GetEnumerator()) {
            nuget install $package.Key -Version $package.Value -ExcludeVersion -NonInteractive `
              -Source https://api.nuget.org/v3/index.json -OutputDirectory build/windows/x64/packages
            if ($LASTEXITCODE -ne 0) { throw "安装 NuGet 包失败：$($package.Key)" }
          }

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包并核验 Windows 三档 ZIP
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaTV-windows-x64
          path: |
            MisaTV-windows-x64.zip
            MisaTV-windows-x64-lite.zip
            MisaTV-windows-x64-standard.zip
          if-no-files-found: error
          retention-days: 14

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v
