name: Build and publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 校验发布版本
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      base-tag: ${{ steps.version.outputs.base-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 读取版本并检查现有 Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pubspec_version=$(awk '$1 == "version:" {print $2}' pubspec.yaml)
          app_version=$(sed -nE "s/^const String kAppVersion = '([^']+)';/\1/p" lib/core/app_version.dart)
          official_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          fork_version="$official_version\.[1-9][0-9]*"
          if [[ ! $pubspec_version =~ ^$official_version\+[1-9][0-9]*$ ||
                ! $app_version =~ ^$fork_version$ ||
                "${pubspec_version%+*}" != "${app_version%.*}" ]]; then
            echo "::error::pubspec.yaml 必须使用 X.Y.Z+N，kAppVersion 必须使用同一官方版本的 X.Y.Z.R"
            exit 1
          fi
          tag="v$app_version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          published_tags=$(jq -r '.[] | select(.draft == false) | .tag_name' <<< "$releases")
          stable_tags=$(jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' <<< "$releases")
          base_tag=$(printf '%s\n' "$stable_tags" | { grep -Ex "v$fork_version" || true; } | sort -V | tail -n 1)
          echo "base-tag=$base_tag" >> "$GITHUB_OUTPUT"
          if grep -Fxq -- "$tag" <<< "$published_tags"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag 已发布，本次生成 Windows 构建产物"
          else
            latest_tag=$(printf '%s\n' "$published_tags" "$tag" | grep -Ex "v$fork_version" | sort -V | tail -n 1)
            if [[ "$latest_tag" != "$tag" ]]; then
              echo "::error::$tag 低于已发布的 $latest_tag，请提高 fork 版本"
              exit 1
            fi
            notes_file="docs/releases/$tag.md"
            if ! grep -q '[^[:space:]]' "$notes_file"; then
              echo "::error file=$notes_file::新版本需要提交非空的更新说明"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    uses: ./.github/workflows/build.yml

  android:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build-android.yml

  macos:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build-macos.yml

  publish:
    name: 发布 ${{ needs.version.outputs.tag }}
    needs: [version, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      BASE_TAG: ${{ needs.version.outputs.base-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 生成 Windows 差异包
        if: env.BASE_TAG != ''
        working-directory: release-assets
        run: |
          mkdir -p baseline
          previous_assets=$(gh release view "$BASE_TAG" --json assets --jq '.assets[].name')
          for name in MisaTV-windows-x64.zip MisaTV-windows-x64-lite.zip MisaTV-windows-x64-standard.zip; do
            if grep -Fxq -- "$name" <<< "$previous_assets"; then
              gh release download "$BASE_TAG" --pattern "$name" --dir baseline
              python ../tool/build_windows_delta.py \
                --base "baseline/$name" --target "MisaTV-windows-x64/$name" \
                --from "$BASE_TAG" --to "$RELEASE_TAG"
            fi
          done

      - name: 发布安装包和 SHA-256
        working-directory: release-assets
        run: |
          mv MisaTV-windows-x64/MisaTV-windows-x64.zip .
          mv MisaTV-windows-x64/MisaTV-windows-x64-lite.zip .
          mv MisaTV-windows-x64/MisaTV-windows-x64-standard.zip .
          mv MisaTV-macos-arm64/MisaTV-macos-arm64.zip .
          mv misatv-android/build/app/outputs/flutter-apk/app-release.apk MisaTV-android-arm64.apk
          shopt -s nullglob
          assets=(MisaTV-windows-x64.zip MisaTV-windows-x64-lite.zip MisaTV-windows-x64-standard.zip
            MisaTV-android-arm64.apk MisaTV-macos-arm64.zip MisaTV-delta-x64-*.zip)
          sha256sum "${assets[@]}" > SHA256SUMS.txt

          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag)')
          if [[ -n "$release" ]]; then
            if [[ $(jq -r '.draft' <<< "$release") == false ]]; then
              echo "::notice::$RELEASE_TAG 已发布"
              exit 0
            fi
            if [[ $(jq -r '.target_commitish' <<< "$release") != "$GITHUB_SHA" ]]; then
              echo "::error::$RELEASE_TAG 的草稿指向其他提交"
              exit 1
            fi
          fi

          # --target 只会用于创建新标签，已有标签需先验证实际指向。
          tag_refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            | jq -r --arg ref "refs/tags/$RELEASE_TAG" '.[] | select(.ref == $ref) | .ref')
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$RELEASE_TAG 已指向其他提交，请提高版本号"
              exit 1
            fi
          fi

          # 创建草稿后上传资产，所有上传成功才公开。重跑时继续同一提交的草稿。
          notes_file="../docs/releases/$RELEASE_TAG.md"
          if [[ -z "$release" ]]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "MisaTV $RELEASE_TAG" --notes-file "$notes_file" --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$notes_file" --draft=false
